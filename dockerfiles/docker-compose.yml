# Ambiente local completo: RabbitMQ + Saneia API (H2 em memória).
# Na raiz do repositório:
#   docker compose -f dockerfiles/docker-compose.yml up --build          (API + RabbitMQ)
#   docker compose -f dockerfiles/docker-compose.yml up -d rabbitmq      (só o broker, para rodar a API pelo Maven)
# Painel do RabbitMQ: http://localhost:15672 (guest / guest)
services:
  rabbitmq:
    build:
      context: .
      dockerfile: rabbitmq.Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      RABBITMQ_HOST: rabbitmq
      # Valores só para a máquina local. Em nuvem eles vêm das variáveis do App Service.
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      DEVICE_KEY: ${DEVICE_KEY:-local-device-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
