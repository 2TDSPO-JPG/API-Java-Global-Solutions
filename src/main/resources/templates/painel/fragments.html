<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo, refresh)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${refresh}" http-equiv="refresh" content="30">
    <title th:text="${titulo} + ' · Saneia Admin'">Saneia Admin</title>
    <style>
        :root {
            --bg: #f3f5f4; --surface: #ffffff; --surface-2: #f8faf9; --line: #e2e8e5;
            --text: #14221c; --muted: #5d6f67; --brand: #0f6b4f; --brand-2: #0b5240; --brand-soft: #e4f2ec;
            --crit: #c62828; --crit-soft: #fdecec; --high: #d9730d; --high-soft: #fdf1e5;
            --mod: #a68a00; --mod-soft: #fbf6dc; --low: #2e7d4f; --low-soft: #e7f4ec;
            --off: #607d8b; --off-soft: #eceff1; --info: #1e5fa8; --info-soft: #e7f0fb;
            --radius: 12px; --shadow: 0 1px 2px rgba(16, 34, 28, .06), 0 4px 14px rgba(16, 34, 28, .05);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
               background: var(--bg); color: var(--text); }
        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
        .side { background: #0e2a21; color: #cfe3da; padding: 22px 14px; position: sticky; top: 0; height: 100vh;
                display: flex; flex-direction: column; gap: 4px; }
        .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 18px;
                padding: 0 10px 18px; }
        .logo .drop { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
                      background: linear-gradient(135deg, #43c59e, #0f6b4f); }
        .logo small { display: block; font-weight: 500; font-size: 11px; color: #8fb5a6; letter-spacing: .08em;
                      text-transform: uppercase; }
        .side a.nav { color: #cfe3da; padding: 9px 12px; border-radius: 8px; display: flex; gap: 10px;
                      align-items: center; font-weight: 500; }
        .side a.nav:hover { background: rgba(255, 255, 255, .06); text-decoration: none; }
        .side a.nav.on { background: #174536; color: #fff; }
        .side .ico { width: 18px; text-align: center; opacity: .9; }
        .side .bottom { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .08); padding: 14px 10px 0;
                        font-size: 12px; color: #8fb5a6; }
        .side .bottom button { margin-top: 8px; width: 100%; color: #e6f2ec; border-color: rgba(255, 255, 255, .28); }
        .side .bottom button:hover { background: rgba(255, 255, 255, .08); }
        main { padding: 26px 32px 48px; min-width: 0; }
        .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px;
               flex-wrap: wrap; }
        h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
        h2 { font-size: 16px; margin: 0 0 12px; }
        .sub { color: var(--muted); margin: 2px 0 0; }
        .grid { display: grid; gap: 16px; }
        .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .span2 { grid-column: span 2; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
                box-shadow: var(--shadow); padding: 18px; min-width: 0; }
        .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                      font-weight: 600; }
        .kpi .value { font-size: 30px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }
        .kpi .hint { color: var(--muted); font-size: 12px; }
        .kpi.crit { border-left: 4px solid var(--crit); }
        .kpi.high { border-left: 4px solid var(--high); }
        .kpi.brand { border-left: 4px solid var(--brand); }
        .kpi.info { border-left: 4px solid var(--info); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600;
             background: var(--surface-2); }
        tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #fbfcfb; }
        .table-wrap { overflow-x: auto; margin: 0 -18px -18px; }
        .table-wrap table th:first-child, .table-wrap table td:first-child { padding-left: 18px; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
                 font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .b-alarm, .b-critico, .b-failed { color: var(--crit); background: var(--crit-soft); }
        .b-warning, .b-alto { color: var(--high); background: var(--high-soft); }
        .b-moderado, .b-received, .b-skipped { color: var(--mod); background: var(--mod-soft); }
        .b-normal, .b-baixo, .b-closed, .b-sent { color: var(--low); background: var(--low-soft); }
        .b-offline { color: var(--off); background: var(--off-soft); }
        .b-in_progress, .b-admin, .b-operator { color: var(--info); background: var(--info-soft); }
        .b-resident { color: var(--brand); background: var(--brand-soft); }
        .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px;
               background: var(--crit-soft); color: var(--crit); margin-left: 6px; }
        .tag.grey { background: var(--off-soft); color: var(--off); }
        .bar { height: 10px; border-radius: 999px; background: #edf1ef; overflow: hidden; position: relative; }
        .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
        .bar.alarm > span { background: var(--crit); }
        .bar.warning > span { background: var(--high); }
        .bar.offline > span { background: var(--off); }
        .bar .limit { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; }
        .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #edf1ef; }
        .stack span { display: block; height: 100%; }
        .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--muted); font-size: 12px; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px;
                    vertical-align: -1px; }
        .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .area { border-radius: 10px; padding: 14px; border: 1px solid var(--line); background: var(--surface); }
        .area.critico { background: var(--crit-soft); border-color: #f3b9b9; }
        .area.alto { background: var(--high-soft); border-color: #f2cda5; }
        .area.moderado { background: var(--mod-soft); border-color: #ece08f; }
        .area.baixo { background: var(--low-soft); border-color: #bfe2cc; }
        .area h3 { margin: 6px 0 2px; font-size: 15px; }
        .area .meta { color: var(--muted); font-size: 12px; }
        .pulse { animation: pulse 1.6s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, .45); }
                           70% { box-shadow: 0 0 0 10px rgba(198, 40, 40, 0); }
                           100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); } }
        .muted { color: var(--muted); }
        .small { font-size: 12px; }
        .right { text-align: right; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .between { justify-content: space-between; }
        .alert { padding: 11px 14px; border-radius: 10px; margin-bottom: 16px; font-weight: 500; }
        .alert.ok { background: var(--low-soft); color: #1e5c39; border: 1px solid #bfe2cc; }
        .alert.err { background: var(--crit-soft); color: #8e1c1c; border: 1px solid #f3b9b9; }
        .alert.warn { background: var(--high-soft); color: #8a4708; border: 1px solid #f2cda5; }
        input, select, textarea { font: inherit; padding: 9px 11px; border: 1px solid #cfd8d4; border-radius: 8px;
                                  background: #fff; color: var(--text); width: 100%; }
        textarea { min-height: 84px; resize: vertical; }
        label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
        .btn, button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 14px;
                       background: var(--brand); color: #fff; cursor: pointer; display: inline-block; }
        .btn:hover, button:hover { background: var(--brand-2); text-decoration: none; }
        .btn.ghost, button.ghost { background: transparent; color: var(--brand); border: 1px solid #b9d6ca; }
        .btn.ghost:hover, button.ghost:hover { background: var(--brand-soft); }
        button.danger { background: transparent; color: var(--crit); border: 1px solid #f0b4b4; }
        button.small, .btn.small { padding: 4px 10px; font-size: 12px; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { width: auto; }
        .chips a { display: inline-block; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
                   background: #fff; color: var(--text); font-weight: 500; margin-right: 6px; }
        .chips a.on { background: var(--brand); color: #fff; border-color: var(--brand); }
        .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 14px; }
        .timeline { list-style: none; margin: 0; padding: 0; }
        .timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
        .timeline li:last-child { border-left-color: transparent; }
        .timeline li::before { content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px;
                               border-radius: 50%; background: var(--brand); border: 2px solid #fff;
                               box-shadow: 0 0 0 1px var(--line); }
        .timeline li.alarm::before { background: var(--crit); }
        .timeline li.warning::before { background: var(--high); }
        .timeline li.offline::before { background: var(--off); }
        dl.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; margin: 0; }
        dl.kv dt { color: var(--muted); font-weight: 600; }
        dl.kv dd { margin: 0; }
        .chart { display: flex; align-items: flex-end; gap: 3px; height: 180px; position: relative;
                 padding-top: 8px; border-bottom: 1px solid var(--line); }
        .chart .col { flex: 1; min-width: 4px; border-radius: 4px 4px 0 0; background: #7cc3a7; }
        .chart .col.alarm { background: var(--crit); }
        .chart .col.warning { background: var(--high); }
        .chart .limit-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--crit); opacity: .7; }
        .chart .limit-line span { position: absolute; right: 0; top: -20px; font-size: 11px; color: var(--crit);
                                  font-weight: 700; background: #fff; padding: 0 4px; }
        .empty { color: var(--muted); padding: 18px 0; text-align: center; }
        .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px;
                      background: radial-gradient(1200px 600px at 10% -10%, #1b5c47 0%, #0e2a21 55%, #0a1f18 100%); }
        .login { width: 100%; max-width: 380px; }
        @media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                                     .g3 { grid-template-columns: 1fr; } }
        @media (max-width: 820px) { .app { grid-template-columns: 1fr; }
                                    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap;
                                            padding: 12px; }
                                    .side .bottom { display: none; } .logo { padding-bottom: 0; width: 100%; }
                                    main { padding: 18px 16px 40px; }
                                    .g2, .g4 { grid-template-columns: 1fr; } .span2 { grid-column: auto; }
                                    dl.kv { grid-template-columns: 1fr; } }

        /* ---------- carregamento ---------- */
        .loading-bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 1001; opacity: 0;
                       background: linear-gradient(90deg, #43c59e, #0f6b4f); box-shadow: 0 0 8px rgba(67, 197, 158, .7);
                       transition: opacity .25s; pointer-events: none; }
        .loading-bar.on { opacity: 1; animation: loadbar 3s cubic-bezier(.1, .7, .3, 1) forwards; }
        @keyframes loadbar { 0% { width: 0; } 40% { width: 55%; } 100% { width: 92%; } }
        .loading-overlay { position: fixed; inset: 0; z-index: 1000; display: none; place-items: center;
                           background: rgba(14, 42, 33, .38); backdrop-filter: blur(2px); }
        .loading-overlay.on { display: grid; animation: fadein .15s ease-out; }
        .loading-box { background: #fff; border-radius: 16px; padding: 22px 28px; min-width: 260px;
                       display: flex; flex-direction: column; align-items: center; gap: 14px;
                       box-shadow: 0 18px 50px rgba(10, 31, 24, .28); font-weight: 600; color: var(--text); }
        .loading-box small { color: var(--muted); font-weight: 500; }
        .drop-loader { position: relative; width: 44px; height: 44px; }
        .drop-loader::before { content: ""; position: absolute; inset: 6px; border-radius: 50% 50% 50% 0;
                               transform: rotate(-45deg); background: linear-gradient(135deg, #43c59e, #0f6b4f);
                               animation: drip 1.1s ease-in-out infinite; }
        .drop-loader::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 30px; height: 6px;
                              margin-left: -15px; border-radius: 50%; background: rgba(15, 107, 79, .18);
                              animation: ripple 1.1s ease-in-out infinite; }
        @keyframes drip { 0%, 100% { transform: rotate(-45deg) translate(0, 0) scale(1); }
                          50% { transform: rotate(-45deg) translate(4px, -4px) scale(.88); } }
        @keyframes ripple { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.6); opacity: .4; } }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        button.is-loading, .btn.is-loading { position: relative; color: transparent !important; pointer-events: none; }
        button.is-loading::after, .btn.is-loading::after { content: ""; position: absolute; inset: 0; margin: auto;
                width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45);
                border-top-color: #fff; animation: spin .7s linear infinite; }
        button.ghost.is-loading::after, button.danger.is-loading::after { border-color: #cfe3da; border-top-color: var(--brand); }
        @media (prefers-reduced-motion: reduce) {
            .loading-bar.on { animation: none; width: 92%; }
            .drop-loader::before, .drop-loader::after, button.is-loading::after, .btn.is-loading::after, .pulse { animation-duration: 2.4s; }
        }
    </style>
    <script>
        /* Feedback de carregamento do painel: barra no topo em toda navegação, spinner no botão enviado
           (evita clique duplo) e tela de espera nos formulários com data-loading="mensagem". */
        (function () {
            function setup() {
                if (document.querySelector('.loading-bar')) { return; }
                var bar = document.createElement('div');
                bar.className = 'loading-bar';
                bar.setAttribute('aria-hidden', 'true');
                var overlay = document.createElement('div');
                overlay.className = 'loading-overlay';
                overlay.setAttribute('role', 'status');
                overlay.setAttribute('aria-live', 'polite');
                overlay.innerHTML = '<div class="loading-box"><span class="drop-loader"></span>'
                    + '<span class="loading-text">Carregando…</span><small>Aguarde um instante</small></div>';
                document.body.appendChild(bar);
                document.body.appendChild(overlay);

                function start(message) {
                    bar.classList.remove('on');
                    void bar.offsetWidth; /* reinicia a animação */
                    bar.classList.add('on');
                    if (message) {
                        overlay.querySelector('.loading-text').textContent = message;
                        overlay.classList.add('on');
                    }
                }
                function stop() {
                    bar.classList.remove('on');
                    overlay.classList.remove('on');
                    document.querySelectorAll('.is-loading').forEach(function (b) {
                        b.classList.remove('is-loading');
                        b.removeAttribute('aria-busy');
                    });
                }
                window.saneiaLoading = { start: start, stop: stop };

                document.addEventListener('submit', function (event) {
                    var form = event.target;
                    var button = event.submitter || form.querySelector('button[type="submit"], button:not([type])');
                    if (button) {
                        if (button.classList.contains('is-loading')) { event.preventDefault(); return; }
                        button.classList.add('is-loading');
                        button.setAttribute('aria-busy', 'true');
                    }
                    start(form.getAttribute('data-loading'));
                });
                document.addEventListener('click', function (event) {
                    var link = event.target.closest ? event.target.closest('a[href]') : null;
                    if (!link || link.target === '_blank' || event.ctrlKey || event.metaKey || event.shiftKey
                        || event.button !== 0 || link.origin !== window.location.origin
                        || link.getAttribute('href').charAt(0) === '#') { return; }
                    start(link.getAttribute('data-loading'));
                });
                window.addEventListener('beforeunload', function () { start(); });
                window.addEventListener('pageshow', stop); /* voltar pelo navegador não deixa o spinner preso */
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setup);
            } else {
                setup();
            }
        })();
    </script>
</head>
<body>

<aside class="side" th:fragment="nav">
    <div class="logo"><span class="drop"></span><div>Saneia<small>Painel admin</small></div></div>
    <a class="nav" th:classappend="${pagina == 'inicio'} ? 'on'" th:href="@{/painel}"><span class="ico">◉</span>Visão geral</a>
    <a class="nav" th:classappend="${pagina == 'areas'} ? 'on'" th:href="@{/painel/areas}"><span class="ico">▦</span>Risco por área</a>
    <a class="nav" th:classappend="${pagina == 'chamados'} ? 'on'" th:href="@{/painel/chamados}"><span class="ico">☰</span>Chamados</a>
    <a class="nav" th:classappend="${pagina == 'equipamentos'} ? 'on'" th:href="@{/painel/equipamentos}"><span class="ico">◈</span>Equipamentos</a>
    <a class="nav" th:classappend="${pagina == 'usuarios'} ? 'on'" th:href="@{/painel/usuarios}"><span class="ico">☺</span>Usuários</a>
    <a class="nav" th:classappend="${pagina == 'alertas'} ? 'on'" th:href="@{/painel/alertas}"><span class="ico">✉</span>Alertas por e-mail</a>
    <a class="nav" th:href="@{/swagger-ui.html}" target="_blank"><span class="ico">⌘</span>API (Swagger)</a>
    <div class="bottom">
        <div>Conectado como</div>
        <strong style="color:#fff" th:text="${usuarioLogado}">admin</strong>
        <form th:action="@{/painel/sair}" method="post" data-loading="Saindo…"><button class="ghost small" type="submit">Sair</button></form>
    </div>
</aside>

<div th:fragment="flash">
    <div class="alert ok" th:if="${sucesso}" th:text="${sucesso}">ok</div>
    <div class="alert err" th:if="${erro}" th:text="${erro}">erro</div>
</div>

</body>
</html>
